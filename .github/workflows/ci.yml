name: TaskFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t taskflow-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t taskflow-frontend ./frontend

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag backend image
        if: github.event_name == 'push'
        run: |
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker tag taskflow-backend ghcr.io/${IMAGE_OWNER}/taskflow-backend:latest
          docker tag taskflow-backend ghcr.io/${IMAGE_OWNER}/taskflow-backend:${{ github.sha }}

      - name: Tag frontend image
        if: github.event_name == 'push'
        run: |
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker tag taskflow-frontend ghcr.io/${IMAGE_OWNER}/taskflow-frontend:latest
          docker tag taskflow-frontend ghcr.io/${IMAGE_OWNER}/taskflow-frontend:${{ github.sha }}

      - name: Push backend image
        if: github.event_name == 'push'
        run: |
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker push ghcr.io/${IMAGE_OWNER}/taskflow-backend:latest
          docker push ghcr.io/${IMAGE_OWNER}/taskflow-backend:${{ github.sha }}

      - name: Push frontend image
        if: github.event_name == 'push'
        run: |
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker push ghcr.io/${IMAGE_OWNER}/taskflow-frontend:latest
          docker push ghcr.io/${IMAGE_OWNER}/taskflow-frontend:${{ github.sha }}